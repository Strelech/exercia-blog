name: Export Carousel Instagram

on:
  workflow_dispatch:
    inputs:
      content_json:
        description: 'Contenu JSON du carousel (5 slides)'
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Write content.json
        env:
          CONTENT_JSON: ${{ inputs.content_json }}
        run: |
          printf '%s' "$CONTENT_JSON" > social/content.json

      - name: Export slides PNG
        run: |
          python social/export_carousel.py \
            --content social/content.json \
            --out social/output

      - name: Upload PNG as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carousel-slides
          path: social/output/*.png
          retention-days: 7
